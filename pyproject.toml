[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "dnd-rules-mcp"
version = "0.1.0"
description = "SRD 5.2.1 hybrid rule retrieval and cited constraint checking over MCP"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND CC-BY-4.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Evan d'Entremont" }]
dependencies = ["mcp>=1.30,<2", "pydantic>=2.11,<3", "fastembed>=0.9.1,<0.10", "numpy>=2,<3"]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.17,<0.18", "pypdf>=7,<8"]

[project.scripts]
dnd-rules = "dnd_rules_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dnd_rules_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"] # Formatter keeps prose/URLs readable without splitting every string.
